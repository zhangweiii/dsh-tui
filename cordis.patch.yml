# The @zhangweiii/dsh-tui bundle: an interactive terminal client over the same host API as
# the Web surface. It opens no HTTP port and mounts no browser-only rows.
#
# DSH 0.2.x published every client capability as Typert Remote contributions, so this
# layer mounts the Host controllers that serve them instead of the removed api-proxy:
# session, workspace, job, and settings controllers plus the roster/inventory owners.
# `dsh-base` already mounts the gateway (`typert-gateway`), storage, the projection cache,
# the tool registry, and the agent plane.

- id: hmr
  disabled: true

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Deployment persona, matching the Web surface: each session's preset may still
# override it through that agent's own scope.
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    # ── Host controllers behind the Remote surface the terminal consumes ────────
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # ── host rows the session surface depends on ────────────────────────────────

    # The session's working directory registry (`workspaceRegistry`).
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # `@` completion index behind the session controller's fileReferences Remote.
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Carrier-neutral Connection registries plus the upload service the session
    # controller's prompt endpoint resolves file receipts through. Neither opens
    # a port: without a `webServer` row, Connection mounts only its in-process
    # RPC registries.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    # Host-owned opt-in the subagent tools resolve when a session receives its
    # preset delegation tools.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Whole-log turn/step counts for the footer's sessionStats projection.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # A terminal cannot use the browser directory picker; browse-mode keeps all
    # path mutations on the shared Host contract.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: tui-startup
      name: '@zhangweiii/dsh-tui/startup'

    - id: tui-runtime
      name: '@zhangweiii/dsh-tui'
      inject: [tuiStartup]
      config:
        initialPrompt: !!js ctx.tuiStartup.initialPrompt
        resume: !!js ctx.tuiStartup.resume
        continueLatest: !!js ctx.tuiStartup.continueLatest
        cwd: !!js ctx.tuiStartup.cwd
        connect: !!js ctx.tuiStartup.connect
        standalone: !!js ctx.tuiStartup.standalone

# A terminal is one session composed process-wide, so the base agent plane stays
# as `dsh-base` mounted it: the model-facing rows keep their deployment owner and
# no preset realm is composed (a preset declares scope-only rows such as the
# persona, which a terminal profile has no agent scope to mount them in).
